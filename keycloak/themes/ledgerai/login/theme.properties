# LedgerAI login theme.
# Extends the stock "keycloak" theme so every Keycloak page (login, reset password, OTP, errors...)
# keeps working and its markup/behaviour is unchanged; only the look is ours.
# css/login.css has the same name as the parent's file, so ours REPLACES the stock one.
parent=keycloak
styles=css/login.css
