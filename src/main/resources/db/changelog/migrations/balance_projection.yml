databaseChangeLog:
  - changeSet:
      id: 20260907-02-create-balance-projection-table
      author: np3
      changes:
        - createTable:
            tableName: balance_projection
            columns:
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_balance_projection_account
                    references: account(id)
              - column:
                  name: total_debits
                  type: numeric(19,4)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: total_credits
                  type: numeric(19,4)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false