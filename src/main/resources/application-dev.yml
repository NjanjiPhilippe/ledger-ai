spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://ledgerai-dev-db:5432/ledgerai}
    username: ${DB_USERNAME:ledgerai}
    password: ${DB_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth-dev.ledgerai.internal/realms/ledgerai}

logging:
  level:
    com.ledgerai: DEBUG